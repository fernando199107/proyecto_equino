    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Desplegable</title>
    <style>
        /* 1. Estilos del menú principal */
        nav ul {
            list-style: none;
            padding: 0;
            background-color: #333; 
            display: flex; 
        }
        nav li {
            position: relative; /*aliniacion del menu */
        }
        nav a {
            color: white;
            text-decoration: none; 
            padding: 15px 20px;
            display: block;
        }
        nav a:hover {
            background-color: #000000;
        }

        /* 2. Estilos del SUBMENÚ (Opciones ocultas) */
        nav ul ul {
            position: absolute; 
            background-color: #444;
            display: none; 
            min-width: 160px;
            flex-direction: column; 
        }
        /* 3. aqui cuando se pasa el cursor sore el sub menu se abre */
        nav li:hover > ul {
            display: flex; 
        }
    </style>
</head>
<body>
