<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body"> 
    <div class="login-container">
        <h1 style="text-align: center;">Iniciar Sesión</h1>
        <p class="login-subtitle">Plataforma de Gestión Equina</p>
        
        <form action="index.html" method="POST"> <div class="form-group">
                <label Interchangeable for="email">Correo Electrónico</label>
                <input class="input-group" type="text" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input class="input-group" type="password" id="password" name="password" placeholder="••••••••" required style="margin-bottom: 20px;
                ">
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
    </div>
</body>
</html>
